services:
  postgres:
    image: postgres:16
    container_name: forma-db
    environment:
      POSTGRES_DB: forma
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: forma
    ports:
      - "5432:5432"
    volumes:
      - forma-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/demo
      dockerfile: Dockerfile
    container_name: forma-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forma
      SPRING_DATASOURCE_USERNAME: forma
      SPRING_DATASOURCE_PASSWORD: forma
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forma-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: forma-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@forma.pl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  forma-data:
  pgadmin-data: